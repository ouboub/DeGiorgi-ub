name: Blueprint

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-blueprint
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: false

      # Builds the blueprint (web + pdf), runs checkdecls on every \lean{...}
      # name, and deploys the docs/ folder to GitHub Pages.
      # API docs are switched off: doc-gen4 documents all of Mathlib, which
      # exceeds the 6-hour limit of GitHub's free runners. Instead, the Lean
      # links go to docs/find/index.html (made by
      # blueprint/scripts/make_source_links.py), which jumps to the source line.
      - name: Compile blueprint
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          api-docs: false
          build-page: false
