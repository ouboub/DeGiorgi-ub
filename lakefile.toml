name = "DeGiorgi"
defaultTargets = ["DeGiorgi"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.29.0-rc6"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "REPL"
git = "https://github.com/leanprover-community/repl"
rev = "v4.29.0-rc6"

[[lean_lib]]
name = "DeGiorgi"
globs = ["DeGiorgi.*"]
